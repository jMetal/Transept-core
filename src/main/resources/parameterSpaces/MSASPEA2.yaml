# Parameter space of a SPEA2-style algorithm for multiple sequence alignment (Transept):
# Evolver's RDEMOEA with configurable ranking and density estimator. The default configuration is
# SPEA2 (strength ranking, k-nearest-neighbour density, sequential truncation). Every operator
# keeps transmembrane helices intact. The population size is given with --population-size.
algorithmResult:
  type: categorical
  values:
    population:
    externalArchive:
      conditionalParameters:
        populationSizeWithArchive:
          type: integer
          range: [2, 1000]
        archiveType:
          type: categorical
          values:
            crowdingDistanceArchive:
            unboundedArchive:
#
createInitialSolutions:
  type: categorical
  values:
    seededDistinct:
#
offspringPopulationSize:
  type: integer
  range: [1, 1000]
#
variation:
  type: categorical
  values:
    crossoverAndMutationVariation:
      conditionalParameters:
        crossover:
          type: categorical
          globalSubParameters:
            crossoverProbability:
              type: double
              range: [0.0, 1.0]
            cutCandidates:
              type: integer
              range: [1, 64]
          values:
            tmSafeSinglePoint:
            tmSafeUniform:
        mutation:
          type: categorical
          globalSubParameters:
            mutationProbability:
              type: double
              range: [0.0, 1.0]
          values:
            tmSafeGapShift:
              conditionalParameters:
                maxShift:
                  type: integer
                  range: [0, 200]
            mergeGapRuns:
            randomChoice:
              conditionalParameters:
                maxShift:
                  type: integer
                  range: [0, 200]
            tmSafeBlockShift:
              conditionalParameters:
                blockShift:
                  type: integer
                  range: [1, 20]
            tmSafeWindowRealign:
              conditionalParameters:
                realignWindow:
                  type: integer
                  range: [10, 500]
#
densityEstimator:
  type: categorical
  values:
    knn:
      conditionalParameters:
        knnNeighborhoodSize:
          type: integer
          range: [1, 5]
        knnNormalizeObjectives:
          type: categorical
          values:
            "true":
            "false":
    crowdingDistance:
#
ranking:
  type: categorical
  values:
    strengthRanking:
    dominanceRanking:
#
selection:
  type: categorical
  values:
    tournament:
      conditionalParameters:
        selectionTournamentSize:
          type: integer
          range: [2, 10]
    random:
#
replacement:
  type: categorical
  values:
    rankingAndDensityEstimator:
      conditionalParameters:
        removalPolicy:
          type: categorical
          values:
            sequential:
            oneShot:
