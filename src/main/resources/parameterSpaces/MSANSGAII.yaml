# Parameter space of NSGA-II for multiple sequence alignment (Transept).
# Every operator keeps transmembrane helices intact. The population size is not part of the
# space: it is given with --population-size.
algorithmResult:
  type: categorical
  values:
    population:
    externalArchive:
      conditionalParameters:
        populationSizeWithArchive:
          type: integer
          range: [2, 200]
        archiveType:
          type: categorical
          values:
            crowdingDistanceArchive:
            unboundedArchive:
            spatialSpreadDeviationArchive:
            knnDistanceArchive:
              conditionalParameters:
                knnDistanceArchiveK:
                  type: integer
                  range: [1, 10]
            angleArchive:
#
createInitialSolutions:
  type: categorical
  values:
    seededDistinct:
#
offspringPopulationSize:
  type: categorical
  values: [1, 5, 10, 20, 50, 100, 200, 400]
#
variation:
  type: categorical
  values:
    crossoverAndMutationVariation:
      conditionalParameters:
        crossover:
          type: categorical
          globalSubParameters:
            crossoverProbability:
              type: double
              range: [0.0, 1.0]
            cutCandidates:
              type: integer
              range: [1, 64]
          values:
            tmSafeSinglePoint:
            tmSafeUniform:
        mutation:
          type: categorical
          globalSubParameters:
            mutationProbability:
              type: double
              range: [0.0, 1.0]
          values:
            tmSafeGapShift:
              conditionalParameters:
                maxShift:
                  type: integer
                  range: [0, 200]
            mergeGapRuns:
            randomChoice:
              conditionalParameters:
                maxShift:
                  type: integer
                  range: [0, 200]
                blockShift:
                  type: integer
                  range: [1, 50]
                realignWindow:
                  type: integer
                  range: [10, 500]
            tmSafeBlockShift:
              conditionalParameters:
                blockShift:
                  type: integer
                  range: [1, 50]
            tmSafeWindowRealign:
              conditionalParameters:
                realignWindow:
                  type: integer
                  range: [10, 500]
#
selection:
  type: categorical
  values:
    tournament:
      conditionalParameters:
        selectionTournamentSize:
          type: integer
          range: [2, 10]
    random:
