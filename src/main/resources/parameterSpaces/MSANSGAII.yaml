# Parameter space of NSGA-II for multiple sequence alignment (Transept).
# Every operator keeps transmembrane helices intact. The population size is not part of the
# space: it is given with --population-size.
algorithmResult:
  type: categorical
  values:
    population:
    externalArchive:
      conditionalParameters:
        populationSizeWithArchive:
          type: integer
          range: [2, 1000]
        archiveType:
          type: categorical
          values:
            crowdingDistanceArchive:
            unboundedArchive:
#
createInitialSolutions:
  type: categorical
  values:
    seededDistinct:
#
offspringPopulationSize:
  type: integer
  range: [1, 1000]
#
variation:
  type: categorical
  values:
    crossoverAndMutationVariation:
      conditionalParameters:
        crossover:
          type: categorical
          globalSubParameters:
            crossoverProbability:
              type: double
              range: [0.0, 1.0]
            cutCandidates:
              type: integer
              range: [1, 64]
          values:
            tmSafeSinglePoint:
        mutation:
          type: categorical
          globalSubParameters:
            mutationProbability:
              type: double
              range: [0.0, 1.0]
          values:
            tmSafeGapShift:
              conditionalParameters:
                maxShift:
                  type: integer
                  range: [0, 200]
            mergeGapRuns:
            randomChoice:
              conditionalParameters:
                maxShift:
                  type: integer
                  range: [0, 200]
#
selection:
  type: categorical
  values:
    tournament:
      conditionalParameters:
        selectionTournamentSize:
          type: integer
          range: [2, 10]
    random:
